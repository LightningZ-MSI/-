<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面不存在 · 台式机功耗计算器</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: #0a0e13; color: #e6edf3;
    font: 15px/1.75 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei",
          "PingFang SC", sans-serif;
  }
  .box { max-width: 520px; text-align: center; }
  .bolt {
    width: 62px; height: 62px; margin: 0 auto 22px; border-radius: 15px;
    background: linear-gradient(135deg, #35d0a5, #4c9aff);
    display: grid; place-items: center; font-size: 32px;
  }
  h1 { font-size: 22px; margin-bottom: 10px; }
  .code {
    font-family: ui-monospace, Consolas, monospace; font-size: 13px;
    color: #f0a92b; margin-bottom: 18px;
  }
  p { color: #9fb0c3; font-size: 14px; margin-bottom: 26px; }
  a.home {
    display: inline-block; padding: 11px 26px; border-radius: 8px;
    background: #35d0a5; color: #04150f; font-weight: 700;
    text-decoration: none; font-size: 14px;
  }
  a.home:hover { background: #1d8f70; color: #fff; }
  .hint { margin-top: 26px; font-size: 12.5px; color: #6b7d92; }
</style>
</head>
<body>
  <div class="box">
    <div class="bolt">⚡</div>
    <h1>这个页面不存在</h1>
    <div class="code">404 Not Found</div>
    <p>地址可能输错了，或者页面已经搬家。<br>本工具是单页应用，所有功能都在首页。</p>
    <a class="home" href="/">回到功耗计算器</a>
    <div class="hint">想算电源瓦数？首页选好 CPU 和显卡就能看到结果。</div>
  </div>
</body>
</html>
